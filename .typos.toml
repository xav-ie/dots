# Allowlist for the report-only typos check. typos never edits files.
[files]
extend-exclude = [
  # emoji shortcode data
  "packages/pickers/spotlight/modes/data.ts",
  # SOPS-encrypted secrets are ciphertext, not prose
  "secrets/",
  # upstream sources, not prose
  "*.patch",
]

[default.extend-words]
ags = "ags"
hass = "hass"
fre = "fre"
# git typo-alias
jsut = "jsut"
# git typo-alias
chekcout = "chekcout"
DNE = "DNE"
# AirPods active noise cancellation
anc = "anc"
# Mesa's OpenGL-on-Vulkan driver
zink = "zink"

[default.extend-identifiers]
# gix field
rela_path = "rela_path"
# avoid camelCase split into PN + Gs
PNGs = "PNGs"
