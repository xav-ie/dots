onboarding = false

[theme]
name = "rose-pine"
auto_switch = false

# xdusk — violet + amber over deep-plum/black. Colors mirror
# ~/Projects/xdusk/palette.nix (the theme's single source of truth); rose-pine
# above is only the dark fallback for any token herdr doesn't expose here.
[theme.custom]
accent = "#9A5FEB" # base0D
blue = "#1060ee" # base02
green = "#00E756" # base0B
mauve = "#9A5FEB" # base0D
overlay0 = "#FFB20F" # base08
overlay1 = "#a89984" # border
panel_bg = "#000000" # bg_editor
peach = "#FFB20F" # base08
red = "#f06949" # base0F
subtext0 = "#a090a0" # base03
surface0 = "#200020" # bg_code
surface1 = "#200030" # bg_header
surface_dim = "#420f24" # statusline_b
teal = "#00a0f0" # base09
text = "#e0e0e0" # base05
yellow = "#FFD242" # base0C

[terminal]
default_shell = "nu"

[keys]
prefix = "ctrl+space"

# Written here rather than left to herdr-fwd's installer: it rewrites this file
# by temp+rename, which replaces home-manager's symlink with a real file and
# fails the next activation.
[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr.fwd.open-dashboard-popup"
description = "Open port-forward dashboard"

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

[ui.sidebar]

# Default is [["state_icon", "workspace", "tab"], ["agent"]]. The tab name says
# what the agent is working on and the agent's own name doesn't, so lead with the
# tab and drop the agent row; the space goes on its own line beneath, where it
# reads as the owner rather than as part of the title.
[ui.sidebar.agents]
rows = [
  # Rendered only on the first agent of each space — herdr drops a row whose
  # tokens all resolve to nothing, and only that agent carries the token
  # (packages/herdr-space-headers keeps it tagged).
  [{ token = "$space_header", fg = "#9A5FEB", bold = true, dim = false }],
  # dim = false is load-bearing: `tab` is a "secondary" token whose base style is
  # overlay0 + Modifier::DIM, and herdr only drops DIM when the config says so
  # (apply_token_style in src/ui/sidebar.rs), so fg alone renders muted.
  [
    "state_icon",
    { token = "tab", fg = "#FFD242", bold = true, dim = false },
    { token = "$siblings", fg = "#a090a0", dim = false }
  ],
]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["$port_forward_status"]]

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true
